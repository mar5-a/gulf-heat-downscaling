# Where coarse weather data gets Gulf cities wrong.
# One config drives every step, so a run can be repeated exactly.

region:              # weather stations inside this box are used
  lat_min: 12.0      # Arabian Peninsula, Iran south of 33 N and southern Iraq
  lat_max: 33.0
  lon_min: 34.0
  lon_max: 62.0
countries: [SA, KW, BH, QA, AE, OM, YE, IR, IQ]
# Results are also reported for this smaller box: the Gulf coast itself.
gulf_box: {lat_min: 23.5, lat_max: 30.5, lon_min: 46.5, lon_max: 57.0}

# The first test (train 2023, test 2024) is kept in reports/test_2024/. 2024 was then
# studied to find problems, so it became training data and 2025 is the new test.
train_years: [2023, 2024]  # models only ever see 2023 and 2024
test_years: [2025]         # every reported score is on 2025
min_hourly_coverage: 0.6   # drop a station-year with readings for fewer than 60% of hours

era5:
  grid_step: 0.25
  variables:
    - temperature_2m
    - dew_point_2m
    - wind_speed_10m
    - wind_direction_10m
    - shortwave_radiation
    - cloud_cover

geohash_precision: 7       # cells of about 150 m x 150 m at Gulf latitudes

features:
  near_radius_cells: 1     # Gaussian-weighted share reaching 1 cell (about 150 m) out
  far_radius_cells: 5      # Gaussian-weighted share reaching 5 cells (about 750 m) out
  coast_window_deg: 0.6    # search this far for the sea
  coast_pixel_deg: 0.0025  # about 275 m pixels for the sea distance
  min_water_body_km2: 20   # ignore lakes and ponds smaller than this

spatial_folds: 7           # stations are split into 7 groups for unseen-station tests
seed: 0

map:
  name: dammam_khobar_dhahran
  lat_min: 26.15
  lat_max: 26.48
  lon_min: 49.95
  lon_max: 50.25
  # Dhahran's hottest well-observed day of 2024 (49 C at the station, ERA5 peaked at 42.8 C):
  # 2 pm local on 19 June and 2 am local that night.
  times_utc: ["2024-06-19T11:00", "2024-06-19T23:00"]
