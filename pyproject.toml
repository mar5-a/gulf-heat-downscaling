[project]
name = "gulfheat"
version = "0.1.0"
description = "Where coarse weather data gets Gulf cities wrong: correcting ERA5 hourly temperature with terrain, land cover and sea features"
authors = [
    { name = "mar5-a" }
]
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pyproj>=3.8.0",
    "pyyaml>=6.0.4",
    "rasterio>=1.5.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "torch>=2.15.0",
    "xarray>=2026.9.0",
    "zarr>=3.4.2",
]

[project.scripts]
gulfheat = "gulfheat.cli:main"

[project.optional-dependencies]
agent = [
    "anthropic>=2.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
